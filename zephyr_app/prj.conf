# ==============================================================================
# EcoConnect IoT Gateway - Week 2 Configuration (Logging + I2C + SPI + TCP/IP)
# ==============================================================================

# General Kernel & UART Console
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_UART_CONSOLE=y

# G7: Zephyr Logging Subsystem over UART with Per-Module Levels
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_APP_MAIN_LOG_LEVEL_INF=y
CONFIG_BME280_MOD_LOG_LEVEL_INF=y
CONFIG_ENC_SPI_MOD_LOG_LEVEL_INF=y
CONFIG_HTTP_SRV_MOD_LOG_LEVEL_DBG=y

# Protocol Drivers (I2C + SPI + RNG for TCP/DHCP)
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_TEST_RANDOM_GENERATOR=y

# M3: ENC28J60 Zephyr Ethernet Driver
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_ENC28J60=y
CONFIG_ETH_ENC28J60_RX_THREAD_STACK_SIZE=2048
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# M4: TCP/IP Stack + DHCPv4 + BSD Sockets + Net Shell
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# Interactive Console Shell & Network Commands (net iface, net ping)
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# Main Stack Size
CONFIG_MAIN_STACK_SIZE=4096
