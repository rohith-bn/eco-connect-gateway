# ==============================================================================
# EcoConnect IoT Gateway - Zephyr Kernel Configuration (Kconfig)
# ==============================================================================

# General Kernel & Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Subsystem Enablement
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# Network Stack (L2 Ethernet + IPv4)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_ENC28J60=y
CONFIG_ETH_ENC28J60_TIMEOUT=100

CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_LOG=y

# Memory & Buffer Sizing
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=1200
CONFIG_NET_RX_STACK_SIZE=1500
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
